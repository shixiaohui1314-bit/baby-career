<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宝宝职业梦想画本</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #fdf6e3; }
    h1 { text-align: center; color: #b58900; }
    .upload-area { border: 2px dashed #ccc; padding: 30px; text-align: center; margin: 20px 0; background: #fff; border-radius: 10px; cursor: pointer; }
    .upload-area:hover { border-color: #b58900; }
    .careers { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
    .career-item { padding: 8px 15px; background: #eee; border-radius: 20px; cursor: pointer; user-select: none; }
    .career-item.selected { background: #268bd2; color: white; }
    button { padding: 12px 30px; background: #b58900; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; display: block; margin: 20px auto; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
    .result-card { width: 150px; text-align: center; background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .result-card img { width: 100%; border-radius: 8px; }
    .token-area { margin-bottom: 15px; }
    .token-area input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🌟 宝宝职业梦想画本</h1>
  <div class="token-area">
    <label>🔑 输入你的 Replicate API Token（免费注册 <a href="https://replicate.com/account/api-tokens" target="_blank">获取</a>）</label>
    <input type="password" id="tokenInput" placeholder="r8_...">
    <small style="color:gray">Token 只会保存在你的浏览器中，不上传服务器。</small>
  </div>

  <div class="upload-area" id="uploadArea">
    <p>📷 点击这里上传宝宝正面清晰照片</p>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <img id="previewImg" style="max-width:200px; display:none; margin:10px auto; border-radius:10px;">
  </div>

  <h3>选择角色（可多选，最多选12个）</h3>
  <div class="careers" id="careerList"></div>

  <button id="generateBtn" disabled>✨ 生成我的画本</button>
  <div id="status" style="text-align:center; margin:10px; color:#268bd2;"></div>

  <h2 style="text-align:center;">📖 画本预览</h2>
  <div class="result" id="resultArea"></div>
  <button id="downloadPdfBtn" style="display:none;">⬇️ 下载打印版 PDF</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const careers = [
      "警察", "医生", "消防员", "宇航员", "厨师", "画家", "科学家", "老师", "飞行员", "篮球运动员",
      "国王", "公主", "超人", "蜘蛛侠", "魔法师", "海盗", "侦探", "圣诞老人", "牛仔", "忍者", "小丑", "恐龙", "机器人"
    ];
    const prompts = {
      "警察": "a cute child as a police officer, saluting, blue uniform, police hat, badge, studio lighting, portrait",
      "医生": "a cute child as a doctor, wearing white coat, holding stethoscope, studio lighting, portrait",
      "消防员": "a cute child as a firefighter, holding fire hose, red helmet, uniform, studio lighting",
      "宇航员": "a cute child as an astronaut, white space suit, helmet, floating gesture, studio lighting",
      "厨师": "a cute child as a chef, white chef hat, apron, holding a wooden spoon, studio lighting",
      "画家": "a cute child as a painter, holding paintbrush and palette, beret, smock, studio lighting",
      "科学家": "a cute child as a scientist, lab coat, holding test tube, glasses, studio lighting",
      "老师": "a cute child as a teacher, holding a book and pointer, glasses, smart outfit, studio lighting",
      "飞行员": "a cute child as a pilot, wearing pilot uniform and cap, aviator sunglasses, studio lighting",
      "篮球运动员": "a cute child as a basketball player, holding basketball, jersey, sporty, studio lighting",
      "国王": "a cute child as a king, wearing a crown, red royal robe, holding scepter, studio lighting",
      "公主": "a cute child as a princess, wearing a pink gown, tiara, holding a magic wand, studio lighting",
      "超人": "a cute child as Superman, red cape, blue suit, flying pose, fist forward, studio lighting",
      "蜘蛛侠": "a cute child as Spider-Man, red and blue suit, shooting web gesture, studio lighting",
      "魔法师": "a cute child as a wizard, pointed hat, robe, holding a magic wand, sparks, studio lighting",
      "海盗": "a cute child as a pirate, eye patch, striped shirt, holding a sword or hook, studio lighting",
      "侦探": "a cute child as a detective, trench coat, holding magnifying glass, deerstalker hat, studio lighting",
      "圣诞老人": "a cute child as Santa Claus, red suit, white beard, holding gift bag, studio lighting",
      "牛仔": "a cute child as a cowboy, cowboy hat, vest, holding a lasso, studio lighting",
      "忍者": "a cute child as a ninja, black mask, holding a katana or nunchaku, dynamic pose, studio lighting",
      "小丑": "a cute child as a clown, colorful wig, red nose, funny expression, studio lighting",
      "恐龙": "a cute child wearing an inflatable dinosaur costume, playful, studio lighting",
      "机器人": "a cute child as a robot, metallic armor, glowing eyes, futuristic, studio lighting"
    };
    const SEED = 12345; // 固定种子，保证同职业一致性

    let token = localStorage.getItem('replicate_token') || '';
    if(token) document.getElementById('tokenInput').value = token;
    let selectedCareers = [];
    let uploadedImageBase64 = null;

    const careerList = document.getElementById('careerList');
    careers.forEach(c => {
      const div = document.createElement('div');
      div.className = 'career-item';
      div.textContent = c;
      div.onclick = () => {
        if (selectedCareers.includes(c)) {
          selectedCareers = selectedCareers.filter(x => x!==c);
          div.classList.remove('selected');
        } else {
          if (selectedCareers.length >= 12) { alert('最多选择12个角色'); return; }
          selectedCareers.push(c);
          div.classList.add('selected');
        }
        document.getElementById('generateBtn').disabled = !(token && uploadedImageBase64 && selectedCareers.length>0);
      };
      careerList.appendChild(div);
    });

    document.getElementById('uploadArea').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        uploadedImageBase64 = reader.result.split(',')[1];
        document.getElementById('previewImg').src = reader.result;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('generateBtn').disabled = !(token && uploadedImageBase64 && selectedCareers.length>0);
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('tokenInput').onchange = (e) => {
      token = e.target.value;
      localStorage.setItem('replicate_token', token);
      document.getElementById('generateBtn').disabled = !(token && uploadedImageBase64 && selectedCareers.length>0);
    };

    document.getElementById('generateBtn').onclick = async () => {
      if (!token || !uploadedImageBase64 || selectedCareers.length===0) return;
      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.textContent = '生成中，请耐心等待...';
      const status = document.getElementById('status');
      const resultArea = document.getElementById('resultArea');
      resultArea.innerHTML = '';
      const results = [];
      for (let i=0; i<selectedCareers.length; i++) {
        const career = selectedCareers[i];
        status.textContent = `正在生成 ${career}（${i+1}/${selectedCareers.length}）...`;
        const prompt = prompts[career];
        try {
          const prediction = await createPrediction(prompt);
          if (prediction.output && prediction.output.length>0) {
            const imgUrl = prediction.output[0];
            results.push({career, imgUrl});
            displayResult(results);
          }
        } catch(err) {
          status.textContent = `${career} 生成失败: ${err.message}`;
        }
      }
      status.textContent = '全部生成完毕！';
      btn.disabled = false;
      btn.textContent = '✨ 重新生成';
      if (results.length > 0) document.getElementById('downloadPdfBtn').style.display = 'block';
    };

    async function createPrediction(prompt) {
      const apiUrl = "https://api.replicate.com/v1/predictions";
      const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(apiUrl);
      
      const response = await fetch(proxyUrl, {
        method: "POST",
        headers: {
          "Authorization": `Token ${token}`,
          "Content-Type": "application/json",
          "X-Requested-With": "XMLHttpRequest"
        },
        body: JSON.stringify({
          version: "zsxkib/instantid:3498e8e87ee51c3faa3dc2b527b5e95ca2e5545a8c3e553ea16a28ae384b98e0",
          input: {
            image: `data:image/jpeg;base64,${uploadedImageBase64}`,
            prompt: prompt,
            negative_prompt: "bad quality, blur, distortion, different face",
            seed: SEED,
            width: 512,
            height: 512,
            num_inference_steps: 25,
            guidance_scale: 7.5
          }
        })
      });

      let prediction = await response.json();
      
      while (prediction.status !== "succeeded" && prediction.status !== "failed") {
        await new Promise(resolve => setTimeout(resolve, 2000));
        const pollUrl = `https://corsproxy.io/?${encodeURIComponent(`https://api.replicate.com/v1/predictions/${prediction.id}`)}`;
        const pollRes = await fetch(pollUrl, {
          headers: { 
            "Authorization": `Token ${token}`,
            "X-Requested-With": "XMLHttpRequest"
          }
        });
        prediction = await pollRes.json();
        if (prediction.status === "failed") throw new Error("生成失败");
      }
      return prediction;
    }

    function displayResult(results) {
      const area = document.getElementById('resultArea');
      area.innerHTML = '';
      results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `<img src="${r.imgUrl}" crossorigin="anonymous"><p>${r.career}</p>`;
        area.appendChild(card);
      });
    }

    document.getElementById('downloadPdfBtn').onclick = () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const cards = document.querySelectorAll('.result-card');
      let x = 10, y = 20;
      cards.forEach((card, i) => {
        const img = card.querySelector('img');
        if (img) {
          doc.addImage(img, 'JPEG', x, y, 40, 40);
          doc.text(card.querySelector('p').textContent, x+10, y+42);
          x += 50;
          if ((i+1)%3 === 0) { x = 10; y += 55; }
          if (y > 250) { doc.addPage(); y = 20; x = 10; }
        }
      });
      doc.save('宝宝职业画本.pdf');
    };
  </script>
</body>
</html>
